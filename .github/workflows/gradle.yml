name: Build Kalkulator Android

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/android.yml'
      - '**/*.gradle'
      - '**/*.gradle.kts'
      - '**/*.kt'
      - '**/*.java'
      - '**/*.xml'
      - '**/*.zip'
      - '**/gradlew'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project ZIP if needed
        run: |
          if [ ! -f "gradlew" ] && [ ! -f "settings.gradle" ] && [ ! -f "settings.gradle.kts" ]; then
            ZIP=$(find . -maxdepth 2 -type f -name '*.zip' | head -n 1)

            if [ -n "$ZIP" ]; then
              echo "Mengekstrak $ZIP"
              mkdir -p extracted
              unzip -q "$ZIP" -d extracted
            fi
          fi

          echo "Daftar file proyek:"
          find . -maxdepth 4 -type f | head -200

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Find Android project
        run: |
          GRADLEW=$(find . -type f -name gradlew -not -path './.git/*' | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew tidak ditemukan."
            echo "Pastikan ZIP berisi proyek Android Gradle yang lengkap."
            exit 1
          fi

          echo "GRADLEW=$GRADLEW" >> "$GITHUB_ENV"
          echo "Proyek ditemukan: $GRADLEW"

      - name: Build APK
        run: |
          chmod +x "$GRADLEW"
          cd "$(dirname "$GRADLEW")"
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kalkulator-Android-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
