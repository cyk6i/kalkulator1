name: Build Kalkulator Android

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/android.yml'
      - '**/*.gradle'
      - '**/*.gradle.kts'
      - '**/*.kt'
      - '**/*.java'
      - '**/*.xml'
      - '**/*.zip'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cari proyek Android
        run: |
          echo "Isi repository:"
          find . -maxdepth 4 -type f | head -200

          if [ ! -f "settings.gradle" ] && \
             [ ! -f "settings.gradle.kts" ] && \
             [ ! -f "build.gradle" ] && \
             [ ! -f "build.gradle.kts" ]; then
            echo "Proyek Gradle belum ditemukan."
            echo "Jika proyek ada dalam ZIP, ZIP perlu diekstrak terlebih dahulu."
            exit 1
          fi

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug
          else
            echo "File gradlew tidak ditemukan."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kalkulator-Android-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
